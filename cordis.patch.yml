# The computer-use capability seam lives on the Host: the provider registers into
# it, and `ctx.computerUse` is the one service any other plugin would read. A
# service consumed beyond one preset cannot be scoped to a preset.
- insert:
    - id: computer-use
      name: '@deepseek-ai/dsh-computer-use'

# The browser-use seam is the same case and takes the same position: the provider
# registers into `ctx.browserUse`, which a preset-scoped provider can still read.
# The shared service stores only the provider name, so it is safe to mount beside
# computer use — the two seams hold separate names and arbitrate nothing.
- insert:
    - id: browser-use
      name: '@deepseek-ai/dsh-browser-use'

# A new agent preset, not an override of a shipped one. A preset is a complete
# agent composition rather than a delta, so this list is the `standard` preset
# verbatim plus the Cua Driver native provider and the Playwright browser
# provider. `standard`, `ptc`, `minimal`, `cordis` and the profile's own `whiting`
# keep exactly the tool sets they had; only a session that picks this preset sees
# the `cua_driver_native__*` and `mcp__playwright-mcp__*` tools.
#
# The providers contribute the tools and their runtimes. Each registration stays
# exclusive, so mounting a second provider for the same seam in one process fails
# with the provider name rather than silently replacing it. The two seams do not
# coordinate: one desktop and one browser belong to whoever is driving them, so
# run a desktop workflow and a browser workflow at a time rather than together.
- insert:
    - id: preset-computer-use
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: computer-use
        name: Computer Use
        description: The standard tool set plus Cua Driver native computer-use tools for the host desktop and Playwright browser tools for Chromium.
        order: 30
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  toolFilter:
                    deny:
                      - schedule_create
                      - schedule_delete
                      - schedule_list
                      - schedule_update
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  toolFilter:
                    deny:
                      - schedule_create
                      - schedule_delete
                      - schedule_list
                      - schedule_update
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true

          # ── computer use ─────────────────────────────────────────────────────────────

          # The native Cua Driver runtime. No configuration: it loads the pinned
          # `@trycua/cua-driver` and uses its same-process defaults, so the tool
          # catalog and every result follow the upstream SDK rather than this
          # preset. Screenshots reach the model only when the session's route
          # declares image input and an attachment store is mounted.
          - id: cua-driver-native
            name: '@deepseek-ai/dsh-experimental-computer-use-cua-driver-native'

          # ── browser use ──────────────────────────────────────────────────────────────

          # Playwright's own browser-control MCP server, pinned at @playwright/mcp
          # 0.0.80 with its playwright 1.63.0-alpha Chromium. `launch` gives each
          # live Session its own browser and the tools come from MCP discovery, so
          # their schemas and descriptions follow the pinned server rather than
          # this preset. No `executablePath`: the server is launched as
          # `--browser chromium`, which is the bundled build `playwright install
          # chromium` provides, and pointing it at another Chromium build is what
          # `executablePath` would change.
          #
          # `toolCallTimeoutMs` exceeds the 60 s MCP default because a navigation
          # to a slow site is a normal outcome, and a timeout would report it as a
          # failed call the model then retries.
          - id: browser-use-playwright-mcp
            name: '@deepseek-ai/dsh-experimental-browser-use-playwright-mcp'
            config:
              mode: launch
              headless: true
              toolCallTimeoutMs: 120000
